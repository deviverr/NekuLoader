server {
    listen 80;
    listen [::]:80;
    server_name nekudev.com www.nekudev.com;
    root /var/www/nekudev;
    location = /nekuloader { return 308 /nekuloader/; }
    location /nekuloader/ {
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / { return 404; }
}
