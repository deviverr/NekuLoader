server {
    server_name nekudev.com www.nekudev.com;
    root /var/www/nekudev;
    location ~ ^/nekuloader/downloads/[^/]+\.(dmg|deb)$ {
        root /var/www/nekudev;
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /nekuloader { return 308 /nekuloader/; }
    location /nekuloader/ {
        index index.html;
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / { return 404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nekudev.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nekudev.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = nekudev.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nekudev.com www.nekudev.com;
    return 404; # managed by Certbot


}