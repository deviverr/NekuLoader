# Include INSIDE the existing nekudev.com HTTPS server block.
# Copy dist/ contents into /var/www/nekudev/nekuloader/ first.
# Confirm the directory and existing server config before applying.
location = /nekuloader {
    return 308 /nekuloader/;
}
location /nekuloader/ {
    root /var/www/nekudev;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
